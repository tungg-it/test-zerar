id: faf04c85-8f6d-4010-9e40-183ff81e93a9
name: login
order: 3.0
method: POST
url: https://gateway-dev-cpdt.mbfs.vn/api/v1/auth/admin/sign-in
headers:
- id: ddac885c-6d86-4b06-a901-6a82d06e6c29
  key: accept
  value: application/json
  enabled: true
body:
  type: json
  content: |+
    {
      "username": "superadmin",
      "password": "123456"
    }



scripts:
  post_response: |-
    var jsonData = pm.response.json();
    if (jsonData.message === "OK") {
        zn.environment.set("access_token", jsonData.data.accessToken);
    }
